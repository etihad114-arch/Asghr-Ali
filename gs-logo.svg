    <path d="M45 42 L82 12"/>
    <path d="M58 52 L95 22"/>
    <path d="M48 35 L70 58"/>
    <path d="M82 12 L105 35"/>
  </g>
  <circle cx="78" cy="39" r="7" fill="#D99A16"/>
  <!-- buildings -->
  <g fill="#0B3153">
    <path d="M116 87V43l18-12v56z"/>
    <path d="M136 87V25l21-14v76z"/>
    <path d="M160 87V47l19-13v53z"/>
  </g>
  <g fill="#F5C64A">
    <rect x="124" y="54" width="5" height="8"/><rect x="124" y="68" width="5" height="8"/>
    <rect x="145" y="39" width="5" height="8"/><rect x="145" y="54" width="5" height="8"/>
    <rect x="145" y="69" width="5" height="8"/>
  </g>
  <!-- total station -->
  <g transform="translate(177 70)">
