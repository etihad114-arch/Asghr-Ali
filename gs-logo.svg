<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="GS Civil Engineering and Surveying Solutions">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#D99A16"/>
      <stop offset="1" stop-color="#F5C64A"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0" stop-color="#082544"/>
      <stop offset="1" stop-color="#12456E"/>
