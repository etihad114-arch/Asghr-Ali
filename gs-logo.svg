  <text x="218" y="73" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="url(#navy)">GS</text>
  <text x="300" y="57" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#0B3153">CIVIL ENGINEERING</text>
  <text x="300" y="89" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#D99A16">&amp; SURVEYING SOLUTIONS</text>
  <text x="302" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#60758A">GPS • SURVEY • DESIGN • PLAN • CONSTRUCT • DELIVER</text>
