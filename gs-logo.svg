  </defs>
  <rect width="620" height="150" rx="18" fill="#ffffff"/>
  <!-- road / survey arc -->
  <path d="M18 122 C72 80, 120 72, 170 28" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M22 132 C78 92, 128 85, 180 40" fill="none" stroke="#0B3153" stroke-width="8" stroke-linecap="round"/>
  <!-- satellite / GNSS -->
